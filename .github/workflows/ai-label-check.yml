# This workflow file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
---
name: AI Label Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - reopened
      - ready_for_review

permissions: {}

jobs:
  ai-assistance-disclosure:
    # The check reads only the ai-assisted and not-ai-assisted labels, so other
    # label changes skip it. The skip is on this caller job on purpose: a skipped
    # caller reports the check name `ai-assistance-disclosure`, not the required
    # `ai-assistance-disclosure / AI Label Check`, so PolicyBot keeps the last result.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["ai-assisted", "not-ai-assisted"]'), github.event.label.name)
    uses: EWA-Services/EWA-Actions/.github/workflows/shareable-ai-label-check.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      actions_ref: main
    secrets:
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
