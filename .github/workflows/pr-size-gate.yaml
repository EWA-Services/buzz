# This workflow file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
---
# Public forks cannot download private EWA-Actions composite actions.
# PR-size delivery stays deferred until active development requires it.
name: PR Size
run-name: >-
  PR Size / PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions: {}

jobs:
  reviewable-size:
    name: Reviewable PR Size
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Record deferred public-fork enforcement
        run: >-
          echo "Public-fork PR-size delivery is deferred until active
          development requires it."
