# This workflow file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
#
# yamllint disable rule:line-length
---
name: Code Review

on:
  repository_dispatch:
    types:
      - ai-review-breaker-reset-command
      - ai-review-override-command
      - review-command
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
  # checkov:skip=CKV_GHA_7: "Manual workflow_dispatch inputs are required for operator validation and debugging."
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      codex_version:
        description: Codex CLI version to install for direct CLI runs (latest or exact semver)
        required: true
        default: latest
        type: string
      codex_model:
        description: Codex model to use for direct CLI runs
        required: true
        default: gpt-6-astra
        type: string
      codex_reasoning_effort:
        description: Codex reasoning effort for direct CLI runs (none|low|medium|high|xhigh)
        required: true
        default: high
        type: string

permissions: {}

jobs:
  code-review:
    if: >-
      (github.event_name != 'repository_dispatch' ||
        (github.actor == 'finn-devops' &&
        github.event.client_payload.github.payload.issue.state == 'open')) &&
      ((github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
        (github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@finn-codex') &&
        (github.event.issue.pull_request || github.event.pull_request)))
    uses: EWA-Services/EWA-Actions/.github/workflows/shareable-code-review.yaml@main
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: write
    with:
      actions_ref: main
      pr_number: >-
        ${{ github.event.client_payload.github.payload.issue.number ||
            inputs.pr_number || '' }}
      comment_body: >-
        ${{ github.event.client_payload.github.payload.comment.body || '' }}
      comment_author: >-
        ${{ github.event.client_payload.github.payload.comment.user.login ||
            'manual-dispatch' }}
      comment_id: >-
        ${{ github.event.client_payload.github.payload.comment.id || '' }}
      ai_review_override_approvers: >-
        ${{ vars.AI_REVIEW_OVERRIDE_APPROVERS || 'jai' }}
      codex_version: ${{ inputs.codex_version || 'latest' }}
      codex_model: ${{ inputs.codex_model || 'gpt-6-astra' }}
      codex_reasoning_effort: ${{ inputs.codex_reasoning_effort || 'high' }}
      dispatch_command: >-
        ${{ github.event.client_payload.slash_command.command || '' }}
      dispatch_issue_state: >-
        ${{ github.event.client_payload.github.payload.issue.state || '' }}
      dispatch_event_action: >-
        ${{ github.event.client_payload.github.payload.action || '' }}
      dispatch_previous_body: >-
        ${{ github.event.client_payload.github.payload.changes.body.from || '' }}
    secrets:
      AI_REVIEW_TELEMETRY_SUPABASE_URL: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL }}
      AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY }}
      FINN_DEVOPS_PERSONAL_ACCESS_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_AUTH_ALERT_WEBHOOK_URL: ${{ secrets.CODEX_AUTH_ALERT_WEBHOOK_URL }}
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
# yamllint enable rule:line-length
