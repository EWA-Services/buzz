---
# Policy Bot configuration for General Engineering repositories
# These repositories require consistent review standards
policy:
  approval:
    - CI docker.yml
    - CI sprig-image.yml
    - CI helm-chart.yml
    - CI push-gateway-helm-chart.yml
    - CI benchmark-harbor.yml
    - Repository CI
    - or:
        - finn-devops bypass no review required
        - engineering review pool approval
    - Jai or Poom approval for PR size workflow changes
  disapproval:
    requires:
      organizations: [EWA-Services]

approval_rules:
  - name: Jai or Poom approval for PR size workflow changes
    description: >-
      Require Jai or Poom to approve changes to the PR size enforcement workflow
    if:
      changed_files:
        paths:
          - ^\.github/workflows/pr-size-gate\.yaml$
    options:
      allow_author: false
      invalidate_on_push: true
    requires:
      count: 1
      users: [jai, poom]

  - name: finn-devops bypass no review required
    description: Allow finn-devops to bypass review requirements
    if:
      targets_branch:
        pattern: ^(main|master|develop)$
      has_author_in:
        users: [finn-devops]
    options:
      allow_author: false
      invalidate_on_push: false
    requires:
      count: 0  # No review requirements for finn-devops
      conditions:
        has_valid_signatures: true
  - name: engineering review pool approval
    description: >-
      Requires 2 approvals from Backend Engineering, Data Engineering,
      Frontend Engineering,
      Platform Engineering, or Engineering Leads for all PRs to main
    if:
      targets_branch:
        pattern: ^(main|master|develop)$
      # Skip this rule (and its request_review) for finn-devops automation PRs.
      # The finn-devops bypass rule above already satisfies the `or` policy
      # for these PRs; matching here too would needlessly tag the human team
      # on every sync/chore/release PR.
      title:
        not_matches:
          - "^ci: synced file\\(s\\)"
          - "^chore\\(deps\\): update pinned action SHAs"
          - "^release(?:\\([^)]*\\))?:"
          - ^chore\([^)]*\):.*release.*
    options:
      allow_author: false
      invalidate_on_push: false
      request_review:
        enabled: true
        # Use requires.count to avoid requesting every eligible team.
        mode: random-users
    requires:
      count: 2
      teams:
        - EWA-Services/data-engineering
        - EWA-Services/engineering-backend
        - EWA-Services/engineering-data
        - EWA-Services/engineering-frontend
        - EWA-Services/engineering-leads
        - EWA-Services/engineering-platform
      conditions:
        has_valid_signatures: true
        has_status:
          conclusions: [success]
          statuses:
            - Validate PR Title and Description
            - ai-assistance-disclosure / AI Label Check
            - pre-commit-check
        has_workflow_result:
          conclusions: [success, skipped]
          workflows:
            - .github/workflows/pr-size-gate.yaml

  - name: CI docker.yml
    if:
      targets_branch:
        pattern: ^(main)$
      changed_files:
        paths:
          - ^Dockerfile$
          - ^Dockerfile\.push\-gateway$
          - ^\.dockerignore$
          - ^\.github/workflows/docker\.yml$
          - ^Cargo\.toml$
          - ^Cargo\.lock$
          - ^rust\-toolchain\.toml$
          - ^crates/.*$
          - ^web/.*$
          - ^package\.json$
          - ^pnpm\-lock\.yaml$
          - ^pnpm\-workspace\.yaml$
          - ^patches/.*$
    requires:
      count: 0
      conditions:
        has_workflow_result:
          conclusions:
            - success
          workflows:
            - .github/workflows/docker.yml
  - name: CI sprig-image.yml
    if:
      targets_branch:
        pattern: ^(main)$
      changed_files:
        paths:
          - ^Dockerfile\.sprig$
          - ^scripts/sprig\-entrypoint\.sh$
          - ^\.github/workflows/sprig\-image\.yml$
    requires:
      count: 0
      conditions:
        has_workflow_result:
          conclusions:
            - success
          workflows:
            - .github/workflows/sprig-image.yml
  - name: CI helm-chart.yml
    if:
      targets_branch:
        pattern: ^(main)$
      changed_files:
        paths:
          - ^deploy/charts/buzz/.*$
          - ^deploy/charts/buzz\-push\-gateway/.*$
          - ^\.github/workflows/helm\-chart\.yml$
          - ^ct\.yaml$
    requires:
      count: 0
      conditions:
        has_workflow_result:
          conclusions:
            - success
          workflows:
            - .github/workflows/helm-chart.yml
  - name: CI push-gateway-helm-chart.yml
    if:
      targets_branch:
        pattern: ^(main)$
      changed_files:
        paths:
          - ^deploy/charts/buzz\-push\-gateway/.*$
          - ^\.github/workflows/push\-gateway\-helm\-chart\.yml$
    requires:
      count: 0
      conditions:
        has_workflow_result:
          conclusions:
            - success
          workflows:
            - .github/workflows/push-gateway-helm-chart.yml
  - name: CI benchmark-harbor.yml
    if:
      targets_branch:
        pattern: ^(main)$
      changed_files:
        paths:
          - ^benchmarks/harbor\-buzz\-orchestra/.*$
          - ^\.github/workflows/benchmark\-harbor\.yml$
    requires:
      count: 0
      conditions:
        has_workflow_result:
          conclusions:
            - success
          workflows:
            - .github/workflows/benchmark-harbor.yml
  - name: Repository CI
    if:
      targets_branch:
        pattern: ^(main)$
    requires:
      count: 0
      conditions:
        has_workflow_result:
          conclusions:
            - success
          workflows:
            - .github/workflows/ci.yml
            - .github/workflows/desktop-release-candidate.yml
