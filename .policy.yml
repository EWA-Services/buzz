# This file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
---
# Policy Bot configuration for General Engineering repositories
# These repositories contain important code requiring consistent review standards
policy:
  approval:
    - or:
        - finn-devops bypass no review required
        - engineering review pool approval
        - engineering review pool approval without automatic requests
    - Jai or Poom approval for PR size workflow changes
  disapproval:
    requires:
      organizations: [EWA-Services]

approval_rules:
  - name: Jai or Poom approval for PR size workflow changes
    description: Require Jai or Poom to approve changes to the PR size enforcement workflow
    if:
      changed_files:
        paths:
          - ^\.github/workflows/pr-size-gate\.yaml$
    options:
      allow_author: false
      invalidate_on_push: true
    requires:
      count: 1
      users: [jai, poom]

  - name: finn-devops bypass no review required
    description: Allow finn-devops to bypass review requirements
    if:
      targets_branch:
        pattern: ^(main|master|develop)$
      has_author_in:
        users: [finn-devops]
    options:
      allow_author: false
      invalidate_on_push: false
    requires:
      count: 0  # No review requirements for finn-devops
      conditions:
        has_valid_signatures: true
  - name: engineering review pool approval
    description: >-
      Requires 2 approvals from Backend Engineering, Data Engineering, Frontend Engineering,
      Platform Engineering, or Engineering Leads for all PRs to main
    if:
      targets_branch:
        pattern: ^(main|master|develop)$
      title:
        not_matches:
          - "^ci: synced file\\(s\\)"
          - "^chore\\(deps\\): update pinned action SHAs"
          - "^release(?:\\([^)]*\\))?:"
          - ^chore\([^)]*\):.*release.*
          - "^[a-z]+\\(deps(-dev)?\\)!?:"
          - >-
            ^[Bb]ump \S+ from v?\d+(\.\d+)*([+-]\S+)? to v?\d+(\.\d+)*([+-]\S+)?( in /.*)?$
          - >-
            ^[Bb]ump the \S+ group( across [0-9]+ director(y|ies)| in /\S+)? with [0-9]+ updates?$
    options:
      allow_author: false
      invalidate_on_push: false
      request_review:
        enabled: true
        # Use requires.count to avoid requesting every eligible team.
        mode: random-users
    requires: &approval_requirements_3
      count: 2
      teams:
        - EWA-Services/data-engineering
        - EWA-Services/engineering-backend
        - EWA-Services/engineering-data
        - EWA-Services/engineering-frontend
        - EWA-Services/engineering-leads
        - EWA-Services/engineering-platform
      conditions:
        has_valid_signatures: true
        has_status:
          conclusions: [success]
          statuses:
            - Validate PR Title and Description
            - ai-assistance-disclosure / AI Label Check
            - pre-commit-check
        has_workflow_result:
          conclusions: [success, skipped]
          workflows:
            - .github/workflows/pr-size-gate.yaml
  - name: engineering review pool approval without automatic requests
    description: >-
      Retain the approval requirement without automatically requesting reviewers
    if:
      targets_branch:
        pattern: ^(main|master|develop)$
      title:
        not_matches:
          - "^ci: synced file\\(s\\)"
          - "^chore\\(deps\\): update pinned action SHAs"
          - "^release(?:\\([^)]*\\))?:"
          - ^chore\([^)]*\):.*release.*
    options:
      allow_author: false
      invalidate_on_push: false
      request_review:
        enabled: false
    requires: *approval_requirements_3
